<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>念念收藏结果</title>
  <style>
    :root{
      --bg:var(--hana-bg,#faf6ee);
      --card:var(--hana-bg-card,#fffdf9);
      --fg:var(--hana-text,#33291d);
      --muted:var(--hana-text-muted,#7d7466);
      --border:var(--hana-border,#e6ddcb);
      --accent:var(--hana-accent,#c27c3e);
      --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
      --r:calc(10px * var(--hana-corner-radius-scale,1));
      --ui:var(--hana-font-ui,system-ui,-apple-system,"Microsoft YaHei",sans-serif);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:0;height:auto}
    body{background:var(--bg);color:var(--fg);font:13.5px/1.6 var(--ui);padding:12px 14px;display:block}
    .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
    .ok{width:19px;height:19px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
    .hd h1{margin:0;font-size:14px;font-weight:700;flex:1;min-width:0}
    .sub{font-size:12px;color:var(--muted);margin-bottom:9px}
    ul{list-style:none;display:grid;gap:6px}
    li{border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:8px 10px;cursor:pointer;transition:.15s}
    li:hover{border-color:var(--accent);background:var(--accent-soft)}
    .t{font-weight:650;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .s{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .m{font-size:11px;color:var(--muted);margin-top:4px}
    .tag{display:inline-block;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
    .acts{display:flex;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}
    button{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--fg);cursor:pointer}
    button:hover{border-color:var(--accent)}
    .grow{flex:1}
    #none{color:var(--muted);font-size:12.5px;padding:8px 0}
  </style>
</head>
<body>
  <div class="hd"><span class="ok" aria-hidden="true">✓</span><h1 id="ttl">已收入念念收藏夹</h1></div>
  <p class="sub" id="sub"></p>
  <ul id="list"></ul>
  <p id="none" hidden>这条回执的内容已经不在了（可能已过期或收藏已被删除）。</p>
  <div class="acts">
    <button id="open" title="打开念念收藏夹面板">🗂 打开收藏夹</button>
    <button id="inbox" title="看收件箱里待整理的收藏">📥 收件箱 <span id="inbox-n"></span></button>
    <span class="grow"></span>
    <button id="more">📥 再收一条</button>
  </div>
  <script type="module">
    import { hana } from "./assets/sdk.js";

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // 宿主不会把消息 payload 传进卡片，所以回执数据走本 App 自己的后端路由读。
    async function render() {
      let payload = null;
      try {
        const r = await hana.api.fetch("/clip/notice").then((x) => x.json());
        payload = r?.ok ? r.notice : null;
      } catch { payload = null; }
      if (!payload || (!Array.isArray(payload.items) || !payload.items.length) && !payload.stats) {
        $("none").hidden = false;
        return;
      }
      if (!payload.items?.length) {
        // 面板指引态：只报现状，不假装收了东西
        const s = payload.stats || {};
        $("ttl").textContent = "念念收藏夹";
        $("inbox-n").textContent = s.inbox ? ` ${s.inbox}` : "";
        $("sub").textContent = `全库 ${s.total ?? 0} 条 · 收件箱待整理 ${s.inbox ?? 0} 条 · 待确认候选 ${s.pending ?? 0} 条。`;
        $("none").hidden = false;
        $("none").textContent = "要收藏内容，直接在对话里选中一段文字，或点消息下方的「📥 收入念念收藏夹」。";
        $("list").innerHTML = "";
        return;
      }
      const n = payload.items.length;
      $("ttl").textContent = n > 1 ? `已收入 ${n} 条到念念收藏夹` : "已收入念念收藏夹";
      $("sub").textContent = payload.from === "clip-picker"
        ? "你刚勾选的内容，AI 已补好标题和标签。"
        : "已按你的内容整理好标题、分类和标签。";
      $("list").innerHTML = payload.items.map((it) =>
        `<li data-id="${esc(it.id)}">
           <div class="t">${esc(it.title || "未命名")}</div>
           <div class="s">${esc(it.snippet || "")}</div>
           <div class="m">${esc(it.category || "收件箱")}${(it.tags || []).map((t) => `<span class="tag">#${esc(t)}</span>`).join("")}</div>
         </li>`).join("");
      for (const li of $("list").querySelectorAll("li")) {
        li.addEventListener("click", () => show(li.dataset.id));
      }
    }

    async function show(id) {
      try { await hana.cards.open("entry", { instanceKey: `e:${id}` }); }
      catch { try { await hana.cards.open("panel"); } catch { /* 宿主不给开就算了，不假装成功 */ } }
    }

    $("open").addEventListener("click", async () => {
      try { await hana.cards.open("panel"); }
      catch (err) { $("sub").textContent = `打不开收藏夹面板：${err?.message || err}`; }
    });
    $("inbox").addEventListener("click", async () => {
      try { await hana.cards.open("panel"); }
      catch (err) { $("sub").textContent = `打不开收藏夹：${err?.message || err}`; }
    });
    $("more").addEventListener("click", async () => {
      try { await hana.cards.open("panel"); }
      catch { $("sub").textContent = "在对话里直接点「📥 收入念念收藏夹」就能再收一条。"; }
    });

    try { await hana.ready({}); } catch { /* 独立打开时无桥，走降级 */ }
    await render();
  </script>
</body>
</html>
