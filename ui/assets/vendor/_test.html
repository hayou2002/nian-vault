<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>docx-preview 真机验证</title>
<style>
  body { margin: 0; padding: 16px; font-family: "Microsoft YaHei", sans-serif; background: #f7f3eb; }
  #status { position: fixed; top: 0; left: 0; right: 0; padding: 8px 16px;
            background: #2a2118; color: #f0b46a; font-size: 13px; z-index: 99; }
  #doc { margin-top: 40px; }
</style>
<script src="./jszip.min.js"></script>
</head>
<body>
<div id="status">加载中…</div>
<div id="doc"></div>

<script type="module">
import { renderAsync } from "./docx-preview.mjs";

const statusEl = document.getElementById("status");
const docEl = document.getElementById("doc");

// 从 URL 取要测的文件
const params = new URLSearchParams(location.search);
const fileUrl = params.get("f");

(async () => {
  try {
    if (!fileUrl) throw new Error("没有传 f 参数");

    const t0 = performance.now();
    const resp = await fetch(fileUrl);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} 读不到文件`);
    const blob = await resp.blob();
    const t1 = performance.now();
    statusEl.textContent = `读取完成 ${(blob.size / 1024).toFixed(0)} KB / ${(t1 - t0).toFixed(0)}ms，开始渲染…`;

    await renderAsync(blob, docEl, undefined, {
      className: "docx",
      inWrapper: true,
      breakPages: true,
      ignoreWidth: false,
      ignoreHeight: false,
      useBase64URL: true,   // ← 关键：CSP 不允许 blob:，必须用 data:
      renderHeaders: true,
      renderFooters: true,
      renderFootnotes: true,
    });

    const t2 = performance.now();
    const text = docEl.innerText || "";
    const imgs = docEl.querySelectorAll("img");
    const tables = docEl.querySelectorAll("table");
    const pages = docEl.querySelectorAll(".docx-wrapper > section");

    // 检查图片 src 是不是 data:（CSP 关键）
    const imgSrcs = [...imgs].map((i) => (i.src || "").slice(0, 20));
    const nonData = imgSrcs.filter((s) => !s.startsWith("data:"));

    const result = {
      ok: true,
      renderMs: Math.round(t2 - t1),
      textLen: text.length,
      textHead: text.replace(/\s+/g, " ").slice(0, 120),
      images: imgs.length,
      imagesAllData: nonData.length === 0,
      badImgSrc: nonData.slice(0, 3),
      tables: tables.length,
      pages: pages.length,
    };

    statusEl.textContent = `✓ 渲染完成 ${result.renderMs}ms · 文字 ${result.textLen} 字 · 图片 ${result.images} · 表格 ${result.tables} · 页 ${result.pages}`;
    // 把结果塞进 title 便于无头模式读
    document.title = "R:" + JSON.stringify(result);
  } catch (err) {
    statusEl.textContent = "✗ 失败：" + err.message;
    document.title = "R:" + JSON.stringify({ ok: false, error: err.message, stack: String(err.stack || "").slice(0, 300) });
  }
})();
</script>
</body>
</html>
