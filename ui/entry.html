<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>念念收藏</title>
  <style>
    :root {
      --bg: var(--hana-bg, #faf6ee);
      --card: var(--hana-bg-card, #fffdf8);
      --fg: var(--hana-text, #33291d);
      --muted: var(--hana-text-muted, #7c7265);
      --border: var(--hana-border, #e4dbc9);
      --accent: var(--hana-accent, #c27c3e);
      --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
      --r: calc(10px * var(--hana-corner-radius-scale, 1));
      --ui: var(--hana-font-ui, system-ui, -apple-system, "Microsoft YaHei", sans-serif);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font: 14px/1.62 var(--ui); display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
    h1 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { font-size: 11.5px; color: var(--muted); padding: 0 12px 8px; flex: 0 0 auto; }
    .meta .tag { display: inline-block; margin-right: 4px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; }
    .body { flex: 1; min-height: 0; overflow: auto; padding: 4px 14px 12px; }
    .md { word-break: break-word; }
    .md h1, .md h2, .md h3 { margin: 1em 0 .4em; line-height: 1.3; }
    .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.06em; }
    .md p { margin: .5em 0; }
    .md a { color: var(--accent); }
    .md code { background: var(--accent-soft); padding: 0 4px; border-radius: 4px; font-family: var(--hana-font-mono, Consolas, monospace); font-size: .92em; }
    .md pre { background: var(--card); border: 1px solid var(--border); padding: 9px 11px; border-radius: var(--r); overflow: auto; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { margin: .5em 0; padding: 2px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
    .md ul, .md ol { padding-left: 20px; margin: .5em 0; }
    .md img { max-width: 100%; border-radius: var(--r); }
    .md table { border-collapse: collapse; margin: .5em 0; }
    .md th, .md td { border: 1px solid var(--border); padding: 3px 9px; }
    footer { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); flex: 0 0 auto; }
    button { font: inherit; font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); color: var(--fg); cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button[disabled] { opacity: .45; cursor: default; }
    .grow { flex: 1; }
    #state { padding: 16px 14px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <span aria-hidden="true">📌</span>
    <h1 id="title">载入中…</h1>
  </header>
  <div class="meta" id="meta"></div>
  <div class="body">
    <div id="state"></div>
    <article class="md" id="body" hidden></article>
  </div>
  <footer>
    <button id="back" title="回到那次收藏所在的对话" disabled>💬 回到对话</button>
    <span class="grow"></span>
    <button id="panel" title="在念念收藏夹里打开这条">🗂 打开收藏夹</button>
  </footer>
  <script type="module">
    import { hana } from "./assets/sdk.js";
    import { renderMarkdown } from "./assets/markdown.js";

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    let entry = null;

    // 这张卡靠 instanceKey 认领自己那一条收藏：同一条只定位同一张卡，不同条目各自成卡。
    function entryIdFromContext(ctx) {
      const raw = String(ctx?.instanceKey || "");
      return raw.startsWith("e:") ? raw.slice(2) : raw;
    }

    async function load(ctx) {
      const id = entryIdFromContext(ctx);
      if (!id) { $("state").textContent = "这张卡没有指定收藏条目：instanceKey 是空的。请回到收藏夹面板，用「⋯ → 📌 钉成卡片」重新钉一次。"; $("state").hidden = false; $("body").hidden = true; return; }
      let r;
      try {
        r = await hana.api.fetch(`/entry?id=${encodeURIComponent(id)}`).then((x) => x.json());
      } catch (err) {
        $("state").textContent = `读取失败：${err?.message || err}`;
        $("state").hidden = false;
        return;
      }
      if (!r?.ok || !r.entry) { $("state").textContent = `找不到这条收藏：${r?.error || "已被删除"}`; $("state").hidden = false; $("body").hidden = true; return; }
      entry = r.entry;
      $("title").textContent = entry.title;
      $("meta").innerHTML =
        `<strong>${esc(entry.category)}</strong> · ${esc(String(entry.updated || "").slice(0, 10))}` +
        (entry.tags?.length ? `<br>${entry.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}` : "");
      $("state").hidden = true;
      $("body").hidden = false;
      $("body").innerHTML = renderMarkdown(entry.content || "");
      bindBody();
      // 层2：只有拿到 sessionId 才能把宿主焦点交回那次对话。
      let sid = entry.session?.sessionId || null;
      if (!sid && entry.session?.sessionPath) {
        try {
          const res = await hana.api.fetch(`/session/resolve?path=${encodeURIComponent(entry.session.sessionPath)}`).then((x) => x.json());
          sid = res?.session?.sessionId || null;
        } catch { /* 解析不出来就保持禁用 */ }
      }
      const back = $("back");
      back.disabled = !sid;
      back.title = sid ? "回到那次收藏所在的对话" : "这条收藏没有可定位的来源会话";
      back.dataset.sessionId = sid || "";
    }

    // 正文里的活链接：外链走新窗口，双链查成条目后开成新卡。
    // 不拦的话 iframe 会被外链直接原地带走，卡片就没了。
    function showHint(text) {
      $("state").hidden = false;
      $("state").textContent = text;
      setTimeout(() => { $("state").hidden = true; }, 2600);
    }

    function bindBody() {
      const box = $("body");
      for (const a of box.querySelectorAll("a[data-link]")) {
        const href = a.getAttribute("href") || "";
        if (!/^https?:\/\//i.test(href)) continue;
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      }
      // iframe 里点外链会原地跳走、把卡片换成网页；改为新窗口，卡片留在原处。
      box.addEventListener("click", (e) => {
        const a = e.target.closest('a[data-link]');
        if (!a) return;
        const href = a.getAttribute("href") || "";
        if (!/^https?:\/\//i.test(href)) return;
        e.preventDefault();
        window.open(href, "_blank", "noopener,noreferrer");
      });
      for (const a of box.querySelectorAll("a[data-wikilink]")) {
        a.addEventListener("click", async (e) => {
          e.preventDefault();
          const title = a.dataset.title;
          if (!title) return;
          // 卡片里没有列表可切，先把双链标题查成条目 id，再开成一张新卡。
          try {
            const r = await hana.api.fetch(`/entries?q=${encodeURIComponent(title)}`).then((x) => x.json());
            const hit = (r?.entries || []).find((x) => String(x.title).toLowerCase() === title.toLowerCase());
            if (!hit) { showHint(`没有找到《${title}》这条收藏`); return; }
            await hana.cards.open("entry", { instanceKey: `e:${hit.id}` });
          } catch (err) { showHint(`没能打开《${title}》：${err?.message || err}`); }
        });
      }
      // 复选框：markdown.js 目前输出 disabled 且不带行号，卡片里没法勾选回写；
      // 不做半套——要做得从渲染器开始改，这里先不挂假交互。
    }

    $("back").addEventListener("click", async () => {
      const sid = $("back").dataset.sessionId;
      if (!sid) return;
      try {
        await hana.sessions.focus({ sessionId: sid });
      } catch (err) {
        $("state").hidden = false;
        $("state").textContent = `没能跳回那次对话：${err?.message || err}`;
      }
    });

    $("panel").addEventListener("click", async () => {
      try { await hana.cards.open("panel"); }
      catch (err) { $("state").hidden = false; $("state").textContent = `打不开收藏夹面板：${err?.message || err}`; }
    });

    // 上下文可能晚于脚本执行到达：先握手，再等 instanceKey，拿到就渲染。
    // 只读一次会踩空——那正是卡片空白的根因。
    let lastCtx = null;
    async function boot() {
      try { await hana.ready({}); } catch { /* 独立打开时无宿主桥，走下面的降级 */ }
      hana.surface?.onContextChanged?.((next) => {
        if (!next) return;
        const id = entryIdFromContext(next);
        if (id && id !== entryIdFromContext(lastCtx)) load(next);
        else if (!id) showNoKey();
      });
      lastCtx = hana.surface?.getContext?.() || null;
      const id = entryIdFromContext(lastCtx);
      if (id) await load(lastCtx);
      else showNoKey();
    }

    function showNoKey() {
      $("title").textContent = "念念收藏";
      $("state").textContent = "这张卡还没绑定到具体某条收藏。回到收藏夹面板打开一条笔记，用「⋯ → 📌 钉成卡片」钉出来，卡片才会显示内容。";
      $("state").hidden = false;
      $("body").hidden = true;
    }

    boot();
  </script>
</body>
</html>
